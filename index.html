<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Catalyst — PBI Diagrams</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1e1e1e;
            color: #ccc;
            min-height: 100vh;
        }

        /* --- Header bar --- */
        .header {
            background: #252526;
            border-bottom: 1px solid #333;
            padding: 1rem 2rem;
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        .header h1 { font-size: 1.3rem; font-weight: 600; color: #e0e0e0; }
        .header .subtitle { font-size: 0.85rem; color: #888; }
        .back-btn {
            background: #333;
            color: #ccc;
            border: 1px solid #555;
            padding: 6px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }
        .back-btn:hover { background: #444; color: #fff; }

        .main { padding: 2rem; }

        /* --- Login --- */
        .login-container { text-align: center; margin-top: 4rem; }
        .login-container button {
            background: #0078d4; color: white; border: none; padding: 14px 40px;
            font-size: 16px; border-radius: 6px; cursor: pointer;
        }
        .login-container button:hover { background: #106ebe; }
        .login-container p { margin-bottom: 1.5rem; font-size: 1.1rem; }

        /* --- Landing page --- */
        .feature-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 1rem;
            margin-top: 1.5rem;
        }
        .feature-card {
            background: #2d2d2d;
            border: 1px solid #3e3e3e;
            border-radius: 10px;
            padding: 1.25rem;
            cursor: pointer;
            transition: all 0.15s ease;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
        }
        .feature-card:hover {
            border-color: #0078d4;
            background: #333;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(0,120,212,0.2);
        }
        .feature-card .card-id {
            font-size: 0.75rem;
            color: #888;
            font-weight: 500;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
        .feature-card .card-title {
            font-size: 1.05rem;
            font-weight: 600;
            color: #e0e0e0;
            line-height: 1.3;
        }
        .feature-card .card-meta {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-size: 0.8rem;
            color: #999;
        }
        .card-state {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 0.75rem;
            font-weight: 500;
        }
        .card-pbi-count {
            background: #3e3e3e;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 0.75rem;
        }

        /* --- Team dropdown --- */
        .team-select {
            background: #333;
            color: #ccc;
            border: 1px solid #555;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
            margin-left: auto;
        }
        .team-select:hover { border-color: #0078d4; }
        .team-select:focus { outline: 1px solid #0078d4; }

        /* --- Diagram page --- */
        .status { font-size: 0.9rem; color: #888; text-align: center; margin-bottom: 1rem; }
        .mermaid { background: #2d2d2d; padding: 2rem; border-radius: 8px; width: 100%; }
        .mermaid svg { width: 100% !important; height: auto !important; max-width: 100%; }
        .mermaid .node rect, .mermaid .node polygon { rx: 8px; ry: 8px; }
        .mermaid .nodeLabel { font-size: 32px !important; padding: 20px 30px !important; }
        .mermaid .edgeLabel { font-size: 14px !important; }
        .mermaid .flowchart-link { stroke-width: 4px !important; }
        .mermaid marker { transform: scale(1.5); }
        .updated { font-size: 0.8rem; color: #888; margin-top: 1rem; text-align: center; }
        .error { color: #eb3345; text-align: center; margin: 1rem; }
        .legend { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin: 1rem 0; }
        .legend-item { display: flex; align-items: center; gap: 6px; font-size: 14px; }
        .legend-swatch { width: 16px; height: 16px; border-radius: 3px; border: 1px solid #555; }
        .diagram-title { font-size: 1.4rem; text-align: center; margin-bottom: 0.5rem; color: #e0e0e0; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
    <script src="https://alcdn.msauth.net/browser/2.38.0/js/msal-browser.min.js"></script>
</head>
<body>
    <div class="header" id="header">
        <div>
            <h1 id="header-title">PBI Dependency Diagrams</h1>
            <div class="subtitle">Live dependency graphs for Vision team features</div>
        </div>
        <select class="team-select" id="team-select" onchange="onTeamChange()">
            <option value="Vision\\Team Catalyst">Team Catalyst</option>
            <option value="Vision\\Team Thunderhorse">Team Thunderhorse</option>
            <option value="Vision\\Team Rogue">Team Rogue</option>
            <option value="Vision\\Team Cerberus">Team Cerberus</option>
        </select>
    </div>

    <div class="main">
        <div class="login-container" id="login-container" style="display:none;">
            <p>Sign in with your Azure AD account to view diagrams.</p>
            <button onclick="signIn()">Sign In</button>
        </div>
        <div class="status" id="status">Loading...</div>
        <div class="error" id="error"></div>

        <!-- Landing page -->
        <div id="landing-view" style="display:none;">
            <div class="feature-grid" id="feature-grid"></div>
        </div>

        <!-- Diagram page -->
        <div id="diagram-view" style="display:none;">
            <div class="diagram-title" id="diagram-title"></div>
            <div class="legend" id="legend"></div>
            <div id="diagram-container"></div>
            <p class="updated" id="updated"></p>
        </div>
    </div>

    <script>
        const CONFIG = {
            clientId: '9b3699cf-b298-41bc-b00a-205cbd5cdb61',
            tenantId: 'ffbd585c-62b9-4d26-97e9-cf789655f313',
            org: 'GlobalDI',
            project: 'Vision',
            areaPath: 'Vision\\Team Catalyst',
            refreshIntervalMs: 60000
        };

        const DEVOPS_SCOPE = '499b84ac-1321-427f-aa17-267ca6975798/vso.work';
        const BASE_URL = 'https://dev.azure.com/' + CONFIG.org + '/' + CONFIG.project;
        const PAGE_URL = window.location.origin + window.location.pathname;

        const params = new URLSearchParams(window.location.search);
        const featureId = params.get('feature') ? parseInt(params.get('feature')) : null;
        var currentTeam = params.get('team') || 'Vision\\Team Catalyst';

        function getTeamLabel(areaPath) {
            return areaPath.split('\\').pop();
        }

        function onTeamChange() {
            var sel = document.getElementById('team-select');
            currentTeam = sel.value;
            var url = PAGE_URL + '?team=' + encodeURIComponent(currentTeam);
            window.location.href = url;
        }

        function initTeamDropdown() {
            var sel = document.getElementById('team-select');
            sel.value = currentTeam;
        }

        const msalConfig = {
            auth: {
                clientId: CONFIG.clientId,
                authority: 'https://login.microsoftonline.com/' + CONFIG.tenantId,
                redirectUri: 'https://rbennsoceaneering.github.io/vision-pbi-diagrams/'
            },
            cache: { cacheLocation: 'localStorage' }
        };

        var msalInstance;
        var accessToken = null;
        var refreshTimer = null;

        async function initMsal() {
            msalInstance = new msal.PublicClientApplication(msalConfig);
            await msalInstance.initialize();

            var response = await msalInstance.handleRedirectPromise();
            if (response) accessToken = response.accessToken;

            var accounts = msalInstance.getAllAccounts();
            if (accounts.length > 0) {
                try {
                    var tokenResponse = await msalInstance.acquireTokenSilent({
                        scopes: [DEVOPS_SCOPE],
                        account: accounts[0]
                    });
                    accessToken = tokenResponse.accessToken;
                } catch (e) {
                    console.log('Silent token failed');
                }
            }

            if (accessToken) {
                document.getElementById('login-container').style.display = 'none';
                initTeamDropdown();
                if (featureId) {
                    showDiagramView();
                } else {
                    showLandingView();
                }
            } else {
                document.getElementById('status').textContent = '';
                document.getElementById('login-container').style.display = 'block';
            }
        }

        async function signIn() {
            try {
                await msalInstance.loginRedirect({ scopes: [DEVOPS_SCOPE] });
            } catch (e) {
                document.getElementById('error').textContent = 'Sign-in failed: ' + e.message;
            }
        }

        async function devopsGet(url) {
            var resp = await fetch(url, {
                headers: { 'Authorization': 'Bearer ' + accessToken }
            });
            if (!resp.ok) throw new Error('API error ' + resp.status);
            return resp.json();
        }

        async function devopsPost(url, body) {
            var resp = await fetch(url, {
                method: 'POST',
                headers: {
                    'Authorization': 'Bearer ' + accessToken,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(body)
            });
            if (!resp.ok) throw new Error('API error ' + resp.status);
            return resp.json();
        }

        function luminance(hex) {
            hex = hex.replace('#', '');
            var r = parseInt(hex.substr(0, 2), 16);
            var g = parseInt(hex.substr(2, 2), 16);
            var b = parseInt(hex.substr(4, 2), 16);
            return (0.299 * r + 0.587 * g + 0.114 * b) / 255;
        }

        function textColor(bgHex) {
            return luminance(bgHex) > 0.5 ? '#000' : '#fff';
        }

        function sanitizeState(state) {
            return state.replace(/[ \-]/g, '_');
        }

        // ==================== LANDING PAGE ====================

        async function showLandingView() {
            document.getElementById('landing-view').style.display = 'block';
            document.getElementById('diagram-view').style.display = 'none';
            var teamLabel = getTeamLabel(currentTeam);
            document.getElementById('header-title').textContent = teamLabel + ' — PBI Dependency Diagrams';
            document.getElementById('status').textContent = 'Loading ' + teamLabel + ' features...';

            try {
                var wiqlResult = await devopsPost(
                    BASE_URL + '/_apis/wit/wiql?api-version=7.0',
                    {
                        query: "SELECT [System.Id] FROM WorkItems WHERE [System.WorkItemType] = 'Feature' AND [System.AreaPath] UNDER '" + currentTeam + "' AND [System.State] <> 'Removed' AND [System.State] <> 'Done' ORDER BY [Microsoft.VSTS.Common.BacklogPriority]"
                    }
                );
                var featureIds = wiqlResult.workItems.map(function(w) { return w.id; });

                // Batch fetch features
                var features = [];
                for (var i = 0; i < featureIds.length; i += 200) {
                    var chunk = featureIds.slice(i, i + 200);
                    var ids = chunk.join(',');
                    var resp = await devopsGet(
                        BASE_URL + '/_apis/wit/workitems?ids=' + ids + '&$expand=relations&api-version=7.0'
                    );
                    for (var j = 0; j < resp.value.length; j++) {
                        var item = resp.value[j];
                        var rels = item.relations || [];
                        var childCount = 0;
                        for (var k = 0; k < rels.length; k++) {
                            if (rels[k].attributes && rels[k].attributes.name === 'Child') childCount++;
                        }
                        if (childCount === 0) continue;
                        features.push({
                            id: item.id,
                            title: item.fields['System.Title'],
                            state: item.fields['System.State'],
                            childCount: childCount
                        });
                    }
                }

                // Get Feature state colors
                var statesResp = await devopsGet(
                    BASE_URL + '/_apis/wit/workitemtypes/Feature/states?api-version=7.0'
                );
                var featureColors = {};
                for (var s = 0; s < statesResp.value.length; s++) {
                    featureColors[statesResp.value[s].name] = '#' + statesResp.value[s].color;
                }

                // Render cards
                var grid = document.getElementById('feature-grid');
                grid.innerHTML = '';
                for (var f = 0; f < features.length; f++) {
                    var feat = features[f];
                    var stateColor = featureColors[feat.state] || '#888';
                    var txtCol = textColor(stateColor);
                    var card = document.createElement('a');
                    card.className = 'feature-card';
                    card.href = PAGE_URL + '?feature=' + feat.id + '&team=' + encodeURIComponent(currentTeam);
                    card.innerHTML =
                        '<div class="card-id">Feature ' + feat.id + '</div>' +
                        '<div class="card-title">' + feat.title + '</div>' +
                        '<div class="card-meta">' +
                            '<span class="card-state" style="background:' + stateColor + ';color:' + txtCol + '">' + feat.state + '</span>' +
                            '<span class="card-pbi-count">' + feat.childCount + ' PBIs</span>' +
                        '</div>';
                    grid.appendChild(card);
                }

                document.getElementById('status').textContent = features.length + ' features with PBIs';

            } catch (e) {
                document.getElementById('error').textContent = 'Error: ' + e.message;
                document.getElementById('status').textContent = 'Failed to load';
                console.error(e);
            }
        }

        // ==================== DIAGRAM PAGE ====================

        async function showDiagramView() {
            document.getElementById('landing-view').style.display = 'none';
            document.getElementById('diagram-view').style.display = 'block';

            // Add back button to header
            var header = document.getElementById('header');
            if (!document.getElementById('back-btn')) {
                var btn = document.createElement('a');
                btn.id = 'back-btn';
                btn.className = 'back-btn';
                btn.href = PAGE_URL + '?team=' + encodeURIComponent(currentTeam);
                btn.innerHTML = '&#8592; All Features';
                header.insertBefore(btn, header.firstChild);
            }

            await loadDiagram();
            refreshTimer = setInterval(loadDiagram, CONFIG.refreshIntervalMs);
        }

        async function loadDiagram() {
            try {
                document.getElementById('status').textContent = 'Fetching data from Azure DevOps...';
                document.getElementById('error').textContent = '';

                var feature = await devopsGet(
                    BASE_URL + '/_apis/wit/workitems/' + featureId + '?$expand=relations&api-version=7.0'
                );
                var featureTitle = 'Feature ' + featureId + ': ' + feature.fields['System.Title'];
                document.getElementById('diagram-title').textContent = featureTitle + ' \u2014 PBI Dependencies';
                document.title = featureTitle + ' \u2014 PBI Diagram';

                var pbiIds = [];
                var rels = feature.relations || [];
                for (var i = 0; i < rels.length; i++) {
                    if (rels[i].attributes && rels[i].attributes.name === 'Child') {
                        pbiIds.push(parseInt(rels[i].url.split('/').pop()));
                    }
                }

                var pbis = [];
                for (var i = 0; i < pbiIds.length; i++) {
                    var item = await devopsGet(
                        BASE_URL + '/_apis/wit/workitems/' + pbiIds[i] + '?$expand=relations&api-version=7.0'
                    );
                    pbis.push({
                        id: item.id,
                        title: item.fields['System.Title'],
                        state: item.fields['System.State'],
                        relations: item.relations || []
                    });
                }

                var edges = [];
                var pbiIdSet = {};
                for (var i = 0; i < pbiIds.length; i++) pbiIdSet[pbiIds[i]] = true;
                for (var i = 0; i < pbis.length; i++) {
                    var pbiRels = pbis[i].relations;
                    for (var j = 0; j < pbiRels.length; j++) {
                        if (pbiRels[j].rel === 'System.LinkTypes.Dependency-Forward') {
                            var succId = parseInt(pbiRels[j].url.split('/').pop());
                            if (pbiIdSet[succId]) edges.push([pbis[i].id, succId]);
                        }
                    }
                }

                var statesResp = await devopsGet(
                    BASE_URL + '/_apis/wit/workitemtypes/Product%20Backlog%20Item/states?api-version=7.0'
                );
                var colors = {};
                for (var i = 0; i < statesResp.value.length; i++) {
                    colors[statesResp.value[i].name] = '#' + statesResp.value[i].color;
                }

                var mermaid_def = 'flowchart TD\n';
                for (var i = 0; i < pbis.length; i++) {
                    var san = sanitizeState(pbis[i].state);
                    var safeTitle = pbis[i].title.replace(/"/g, '#quot;');
                    mermaid_def += '    PBI' + pbis[i].id + '["' + safeTitle + '"]:::state_' + san + '\n';
                }
                for (var i = 0; i < edges.length; i++) {
                    mermaid_def += '    PBI' + edges[i][0] + ' --> PBI' + edges[i][1] + '\n';
                }
                for (var i = 0; i < pbis.length; i++) {
                    var url = BASE_URL + '/_workitems/edit/' + pbis[i].id;
                    mermaid_def += '    click PBI' + pbis[i].id + ' "' + url + '" _blank\n';
                }
                var seenStates = {};
                for (var i = 0; i < pbis.length; i++) {
                    var st = pbis[i].state;
                    if (!seenStates[st]) {
                        seenStates[st] = true;
                        var san = sanitizeState(st);
                        var hex = colors[st] || '#888888';
                        var txt = textColor(hex);
                        mermaid_def += '    classDef state_' + san + ' fill:' + hex + ',color:' + txt + '\n';
                    }
                }

                var legendEl = document.getElementById('legend');
                legendEl.innerHTML = '';
                for (var st in seenStates) {
                    var hex = colors[st] || '#888888';
                    legendEl.innerHTML += '<div class="legend-item"><div class="legend-swatch" style="background:' + hex + '"></div>' + st + '</div>';
                }

                var container = document.getElementById('diagram-container');
                container.innerHTML = '<div class="mermaid">\n' + mermaid_def + '\n</div>';
                await mermaid.run({ nodes: container.querySelectorAll('.mermaid') });

                var now = new Date().toLocaleString();
                document.getElementById('updated').textContent = 'Last updated: ' + now + ' (auto-refreshes every ' + (CONFIG.refreshIntervalMs / 1000) + 's)';
                document.getElementById('status').textContent = pbis.length + ' PBIs, ' + edges.length + ' dependencies';

            } catch (e) {
                document.getElementById('error').textContent = 'Error: ' + e.message;
                document.getElementById('status').textContent = 'Failed to load';
                console.error(e);
            }
        }

        // Init mermaid
        mermaid.initialize({
            startOnLoad: false,
            theme: 'dark',
            securityLevel: 'loose',
            flowchart: {
                useMaxWidth: true,
                padding: 30,
                nodeSpacing: 100,
                rankSpacing: 120,
                htmlLabels: true,
                wrappingWidth: 300,
                curve: 'basis',
                defaultRenderer: 'elk'
            },
            elk: {
                mergeEdges: true,
                nodePlacementStrategy: 'NETWORK_SIMPLEX',
                'elk.edgeRouting': 'ORTHOGONAL',
                'elk.layered.spacing.nodeNodeBetweenLayers': '120',
                'elk.spacing.nodeNode': '100'
            },
            themeVariables: { fontSize: '32px' }
        });

        initMsal();
    </script>
</body>
</html>
